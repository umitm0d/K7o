name: EPG Güncelle
on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
jobs:
  epg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Birleştir
        env:
          EPG_URLS: ${{ secrets.EPG_URLS }}
        run: python merge_epg.py
      - name: Secret gist'e yükle
        env:
          GIST_ID: ${{ secrets.GIST_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          git clone "https://x-access-token:${GIST_TOKEN}@gist.github.com/${GIST_ID}.git" gist
          cd gist
          BRANCH=$(git rev-parse --abbrev-ref HEAD)
          git checkout --orphan yeni
          git rm -rf . >/dev/null 2>&1 || true
          cp ../out/epg.xml ../out/epg.xml.gz .
          git add .
          git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -m "epg $(date -u +%F-%H:%M)"
          git push -f origin yeni:${BRANCH}
